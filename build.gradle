plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'io.github.heconis.pocketdimensions'
version = '0.3.2'
base { archivesName = 'pocket-dimensions' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += compileClasspath
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            mods {
                pocket_dimensions { source sourceSets.main }
            }
        }
        client { workingDirectory project.file('run') }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', 'pocket_dimensions'
            mods {
                pocket_dimensions { source sourceSets.gameTest }
            }
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'pocket_dimensions.refmap.json'
    config 'pocket_dimensions.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar').configure {
    manifest.attributes('Implementation-Version': project.version, 'MixinConfigs': 'pocket_dimensions.mixins.json')
    finalizedBy 'reobfJar'
}
